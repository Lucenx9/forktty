# FORKTTY PATCH: workspace-inherited fields replaced with the values from the
# upstream workspace root, and an explicit [workspace] added, so the crate
# resolves standalone under [patch.crates-io] (cargo resolves patch paths
# against the patching workspace, where the inherited keys don't exist).
[package]
name = "libghostty-vt-sys"
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uzaaft/libghostty-rs"
rust-version = "1.90"
links = "ghostty-vt"
build = "build.rs"

[workspace]

[lib]
doctest = false

[features]
default = ["vendored"]
vendored = []
pkg-config = ["dep:pkg-config"]
link-dynamic = []
bindgen-tool = ["dep:bindgen", "dep:libc", "dep:heck"]
kitty-graphics = []

[dependencies]
bindgen = {version = "0.72.1", optional = true}
libc = {version = "0.2", optional = true}
heck = {version = "0.5", optional = true}

[build-dependencies]
pkg-config = { version = "0.3", optional = true }

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]
