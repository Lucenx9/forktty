[package]
name = "forktty-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "ForkTTY terminal backend trait with headless and Ghostty adapters"

[features]
default = []
ghostty-vt = ["dep:libghostty-vt", "dep:nix", "dep:libc"]

[dependencies]
forktty-core = { path = "../forktty-core" }
serde.workspace = true
thiserror.workspace = true
libc = { workspace = true, optional = true }
libghostty-vt = { workspace = true, optional = true }
nix = { workspace = true, optional = true, features = ["fs", "ioctl", "poll", "process", "signal", "term"] }

[dev-dependencies]
tempfile.workspace = true
