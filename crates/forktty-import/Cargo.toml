[package]
name = "forktty-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Headless browser-data import engine for ForkTTY (Firefox + Chromium cookies/history/bookmarks)"

[features]
# Off by default for the headless crate: the v11 Secret Service path needs a
# session D-Bus/keyring at runtime. v10 "peanuts" is always available.
keyring = ["dep:secret-service"]

[dependencies]
aes.workspace = true
cbc.workspace = true
dirs.workspace = true
forktty-core = { path = "../forktty-core" }
hmac.workspace = true
pbkdf2.workspace = true
rusqlite.workspace = true
secret-service = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
tempfile.workspace = true

[dev-dependencies]
