[package]
name = "forktty-ui-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "ForkTTY GTK4/libadwaita application shell"

[features]
default = []
gtk-vte = ["dep:adw", "dep:gtk4", "forktty-terminal/vte"]

[dependencies]
forktty-core = { path = "../forktty-core" }
forktty-socket = { path = "../forktty-socket" }
forktty-terminal = { path = "../forktty-terminal" }
adw = { package = "libadwaita", version = "0.9", optional = true }
gtk4 = { version = "0.11", optional = true }
tokio.workspace = true
