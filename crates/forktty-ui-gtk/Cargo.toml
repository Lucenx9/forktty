[package]
name = "forktty-ui-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "ForkTTY GTK4/libadwaita application shell"

[[bin]]
name = "forktty"
path = "src/main.rs"

[features]
default = ["gtk-ghostty"]
gtk-ghostty = ["dep:adw", "dep:gtk4", "dep:global-hotkey", "dep:libloading", "dep:pangocairo", "forktty-terminal/ghostty-vt"]
browser = ["gtk-ghostty", "dep:webkit6", "dep:async-channel", "forktty-socket/browser"]

[dependencies]
forktty-core = { path = "../forktty-core" }
forktty-socket = { path = "../forktty-socket" }
forktty-terminal = { path = "../forktty-terminal" }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"], optional = true }
async-channel = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
global-hotkey = { version = "0.8", optional = true }
gtk4 = { version = "0.10", optional = true }
libc.workspace = true
libloading = { version = "0.9", optional = true }
pangocairo = { version = "0.21", optional = true }
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
ureq.workspace = true
webkit6 = { version = "0.5", optional = true }

[dev-dependencies]
git2.workspace = true
tempfile.workspace = true
