name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev desktop-file-utils rpm \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check src/

      - name: ESLint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend build (also required by tauri::generate_context!)
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            src-tauri

      - name: GTK workspace fmt
        run: cargo fmt --all --check

      - name: GTK workspace tests
        run: cargo test --workspace

      - name: GTK/VTE build
        run: cargo build -p forktty-ui-gtk --features gtk-vte

      - name: Validate GTK desktop entry
        run: desktop-file-validate packaging/linux/forktty-gtk.desktop

      - name: GTK deb package
        run: bash scripts/gtk-build-deb.sh

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo audit
        run: cargo install cargo-audit --locked && cargo audit --file src-tauri/Cargo.lock

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Tauri bundle
        run: npm run tauri:build

      - name: Validate desktop entry
        run: desktop-file-validate src-tauri/target/release/bundle/appimage/ForkTTY.AppDir/ForkTTY.desktop

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  release-gtk-package:
    name: Release GTK Package
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install GTK packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libadwaita-1-dev \
            libvte-2.91-gtk4-dev desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Build GTK deb package
        run: bash scripts/gtk-build-deb.sh

      - name: Upload GTK deb to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/packaging/deb/*.deb --clobber
