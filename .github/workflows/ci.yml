name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Repository checks
        run: cargo run -p xtask -- check

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust clippy
        run: cargo clippy --workspace --features gtk-vte -- -D warnings

      - name: GTK/VTE build
        run: cargo build -p forktty-ui-gtk --features gtk-vte

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/forktty.desktop

      - name: Debian package
        run: bash scripts/build-deb.sh

      - name: cargo audit
        run: cargo install cargo-audit --locked && cargo audit

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  release-package:
    name: Release Package
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Build Debian package
        run: bash scripts/build-deb.sh

      - name: Install AppImage packaging tool
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64 | aarch64) ;;
            *)
              echo "Unsupported AppImage tool architecture: $arch" >&2
              exit 1
              ;;
          esac

          mkdir -p target/packaging/tools
          curl -fsSL \
            -o target/packaging/tools/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x target/packaging/tools/appimagetool
          echo "$PWD/target/packaging/tools" >> "$GITHUB_PATH"

      - name: Build experimental AppImage
        run: bash scripts/build-appimage.sh

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          deb_version="$version"
          if [[ "$version" == *-* ]]; then
            deb_version="${version%%-*}~${version#*-}"
          fi

          deb_arch="$(dpkg --print-architecture)"
          case "$(uname -m)" in
            x86_64) appimage_arch="x86_64" ;;
            aarch64 | arm64) appimage_arch="aarch64" ;;
            *)
              echo "Unsupported AppImage artifact architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          deb_artifact="target/packaging/deb/forktty_${deb_version}_${deb_arch}.deb"
          appimage_artifact="target/packaging/appimage/forktty-${version}-${appimage_arch}.AppImage"
          for artifact in "$deb_artifact" "$appimage_artifact"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Expected artifact missing: $artifact" >&2
              exit 1
            fi
          done

          rm -rf target/packaging/release
          mkdir -p target/packaging/release
          deb_release_name="$(basename "$deb_artifact")"
          deb_release_name="${deb_release_name//\~/.}"
          cp "$appimage_artifact" target/packaging/release/
          cp "$deb_artifact" "target/packaging/release/$deb_release_name"

      - name: Generate SHA256 checksums
        working-directory: target/packaging/release
        run: |
          shopt -s nullglob
          artifacts=( *.AppImage *.deb )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No package artifacts found" >&2
            exit 1
          fi
          sha256sum "${artifacts[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages and checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$REF_NAME" \
            target/packaging/release/*.AppImage \
            target/packaging/release/*.deb \
            target/packaging/release/SHA256SUMS \
            --clobber
