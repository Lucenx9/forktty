name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  APPIMAGETOOL_VERSION: "1.9.0"
  APPIMAGE_RUNTIME_VERSION: "20251108"
  FORKTTY_SKIP_GTK_WIDGET_TESTS: "1"

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install system dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev git appstream \
            meson ninja-build python3-gi libxml2-utils pkg-config

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Repository checks
        run: cargo run -p xtask -- check

      - name: Rust tests
        run: cargo test --workspace --all-targets --no-default-features --features gtk-ghostty

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features gtk-ghostty -- -D warnings

      - name: GTK/Ghostty build
        run: cargo build -p forktty-ui-gtk --no-default-features --features gtk-ghostty

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/dev.forktty.forktty.desktop

      - name: Build embedded Ghostty library
        run: |
          set -euo pipefail
          blueprint_compiler_commit=31b62c24a72c1670d2d93dcdf2d130f1ae12778e
          git clone --filter=blob:none --no-checkout \
            https://gitlab.gnome.org/GNOME/blueprint-compiler.git \
            /tmp/blueprint-compiler
          git -C /tmp/blueprint-compiler fetch --depth 1 origin "${blueprint_compiler_commit}"
          git -C /tmp/blueprint-compiler checkout --detach "${blueprint_compiler_commit}"
          meson setup /tmp/blueprint-compiler-build /tmp/blueprint-compiler --prefix=/usr
          sudo ninja -C /tmp/blueprint-compiler-build install
          scripts/ghostty-gtk-lib-probe.sh

      - name: Debian package
        run: bash scripts/build-deb.sh

      # Shells and agent hooks run the installed binary without
      # LD_LIBRARY_PATH, so it must find the bundled libghostty through
      # RUNPATH alone (regression: v0.2.0-alpha.7 shipped with none).
      - name: Verify binary RUNPATH
        run: |
          readelf -d target/release/forktty | grep -E 'RUNPATH|RPATH' | grep -F '$ORIGIN/../lib'

      - name: cargo audit
        run: cargo install cargo-audit --locked && cargo audit

  browser-feature:
    name: Browser Feature Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install browser build dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev \
            libgtk-4-dev libadwaita-1-dev git libwebkitgtk-6.0-dev

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .

      - name: Browser feature tests
        run: cargo test -p forktty-ui-gtk --all-targets --no-default-features --features browser -- --test-threads=1

      - name: Browser feature clippy
        run: cargo clippy -p forktty-ui-gtk --all-targets --no-default-features --features browser -- -D warnings

      - name: Browser feature build
        run: cargo build -p forktty-ui-gtk --no-default-features --features browser

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  release-package:
    name: Release Package
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # The release event is already published at this point. Delay artifact
    # construction and upload until both source gates pass.
    needs: [check, browser-feature]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Slice C builds the embedded Ghostty library from vendor/ghostty.
          submodules: true

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev git appstream curl zsync \
            meson ninja-build python3-gi libxml2-utils pkg-config xvfb xauth

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .

      - name: Verify tag matches Cargo version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: cargo run -p xtask --locked -- check-release-tag "$REF_NAME"

      # Embedded Ghostty panes are the default renderer path, so release
      # artifacts must contain the embedding library. A release build may not
      # silently omit it because terminal panes require it at runtime.
      - name: Build embedded Ghostty library
        run: |
          set -euo pipefail
          blueprint_compiler_commit=31b62c24a72c1670d2d93dcdf2d130f1ae12778e
          git clone --filter=blob:none --no-checkout \
            https://gitlab.gnome.org/GNOME/blueprint-compiler.git \
            /tmp/blueprint-compiler
          git -C /tmp/blueprint-compiler fetch --depth 1 origin "${blueprint_compiler_commit}"
          git -C /tmp/blueprint-compiler checkout --detach "${blueprint_compiler_commit}"
          meson setup /tmp/blueprint-compiler-build /tmp/blueprint-compiler --prefix=/usr
          sudo ninja -C /tmp/blueprint-compiler-build install
          scripts/ghostty-gtk-lib-probe.sh

      - name: Build Debian package
        run: bash scripts/build-deb.sh

      - name: Install AppImage packaging tool
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64)
              appimagetool_sha256="46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1"
              runtime_sha256="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
              ;;
            aarch64)
              appimagetool_sha256="04f45ea45b5aa07bb2b071aed9dbf7a5185d3953b11b47358c1311f11ea94a96"
              runtime_sha256="00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444"
              ;;
            *)
              echo "Unsupported AppImage tool architecture: $arch" >&2
              exit 1
              ;;
          esac

          mkdir -p target/packaging/tools
          appimagetool_path="target/packaging/tools/appimagetool"
          runtime_path="target/packaging/tools/runtime-${arch}"
          curl -fsSL \
            -o "$appimagetool_path" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${arch}.AppImage"
          printf '%s  %s\n' "$appimagetool_sha256" "$appimagetool_path" | sha256sum -c -
          chmod +x "$appimagetool_path"
          curl -fsSL \
            -o "$runtime_path" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${arch}"
          printf '%s  %s\n' "$runtime_sha256" "$runtime_path" | sha256sum -c -
          echo "$PWD/target/packaging/tools" >> "$GITHUB_PATH"
          echo "APPIMAGE_RUNTIME_FILE=$PWD/$runtime_path" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: APPIMAGE_UPDATE_INFO=1 bash scripts/build-appimage.sh

      - name: Smoke packaged artifacts
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          deb_version="$version"
          if [[ "$version" == *-* ]]; then
            deb_version="${version%%-*}~${version#*-}"
          fi
          deb_arch="$(dpkg --print-architecture)"
          case "$(uname -m)" in
            x86_64) appimage_arch="x86_64" ;;
            aarch64 | arm64) appimage_arch="aarch64" ;;
            *)
              echo "Unsupported AppImage artifact architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          deb_artifact="target/packaging/deb/forktty_${deb_version}_${deb_arch}.deb"
          appimage_artifact="target/packaging/appimage/forktty-${version}-${appimage_arch}.AppImage"
          appimage_zsync="${appimage_artifact}.zsync"
          for artifact in "$deb_artifact" "$appimage_artifact" "$appimage_zsync"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Expected artifact missing: $artifact" >&2
              exit 1
            fi
          done
          scripts/check-appimage-bundled-container.sh "$appimage_artifact"

          smoke_home="$(mktemp -d)"
          export HOME="$smoke_home/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_RUNTIME_DIR="$smoke_home/runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          dpkg-deb --info "$deb_artifact" >/dev/null
          dpkg-deb --contents "$deb_artifact" >/dev/null
          deb_root="$smoke_home/deb-root"
          dpkg-deb -x "$deb_artifact" "$deb_root"
          # No LD_LIBRARY_PATH on purpose: shells and agent hooks run the
          # installed binary bare, so it must reach the bundled libghostty
          # in deb_root/usr/lib through its RUNPATH ($ORIGIN/../lib) alone
          # (regression: v0.2.0-alpha.7 shipped with no RUNPATH).
          readelf -d "$deb_root/usr/bin/forktty" \
            | grep -E 'RUNPATH|RPATH' | grep -F '$ORIGIN/../lib'
          deb_run() {
            env -u LD_LIBRARY_PATH "$deb_root/usr/bin/forktty" "$@"
          }
          deb_run --version
          deb_run --help
          deb_run doctor
          deb_run hooks setup --dry-run codex

          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage_artifact" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage_artifact" --help
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage_artifact" doctor
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage_artifact" hooks setup --dry-run codex

          # Exercise the inner AppImage binary the way a PTY child does:
          # the app strips AppImage LD_LIBRARY_PATH entries from terminal
          # children, so `forktty` resolved from PATH inside a shell loads
          # libghostty via RUNPATH (regression: v0.2.0-alpha.7 loader error).
          appimage_abs="$PWD/$appimage_artifact"
          (cd "$smoke_home" && "$appimage_abs" --appimage-extract >/dev/null)
          approot="$smoke_home/squashfs-root"
          readelf -d "$approot/usr/bin/forktty" \
            | grep -E 'RUNPATH|RPATH' | grep -F '$ORIGIN/../lib'
          # Agent hooks need a stable AppImage path in child environments.
          grep -q '^export FORKTTY_APPIMAGE=' "$approot/AppRun"
          grep -q '^export FORKTTY_APPIMAGE_DIR=' "$approot/AppRun"
          env -u LD_LIBRARY_PATH "$approot/usr/bin/forktty" --version
          env -u LD_LIBRARY_PATH "$approot/usr/bin/forktty" doctor

          # The embedded Ghostty library must reach both artifacts, or terminal
          # panes cannot open in installed builds.
          if [[ -f vendor/ghostty/zig-out/lib/ghostty-gtk-embed.so \
                || -f vendor/ghostty/zig-out/lib/libghostty-gtk-embed.so ]]; then
            test -f "$deb_root/usr/lib/ghostty-gtk-embed.so"
            test -f "$approot/usr/lib/ghostty-gtk-embed.so"
            echo "Embedded Ghostty library shipped in deb and AppImage."
          else
            echo "Embedded Ghostty library was required but not built." >&2
            exit 1
          fi

          # `--version`/`doctor` only exercise the Rust binary. Launch the
          # packaged AppImage through the real GTK/Ghostty socket smoke so CI
          # catches missing dlopen dependencies in ghostty-gtk-embed.so before
          # uploading an artifact whose terminal panes cannot start.
          FORKTTY_SMOKE_BUILD=0 \
            FORKTTY_SMOKE_BIN="$PWD/$appimage_artifact" \
            scripts/gtk-ghostty-smoke.sh

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          deb_version="$version"
          if [[ "$version" == *-* ]]; then
            deb_version="${version%%-*}~${version#*-}"
          fi

          deb_arch="$(dpkg --print-architecture)"
          case "$(uname -m)" in
            x86_64) appimage_arch="x86_64" ;;
            aarch64 | arm64) appimage_arch="aarch64" ;;
            *)
              echo "Unsupported AppImage artifact architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          deb_artifact="target/packaging/deb/forktty_${deb_version}_${deb_arch}.deb"
          appimage_artifact="target/packaging/appimage/forktty-${version}-${appimage_arch}.AppImage"
          appimage_zsync="${appimage_artifact}.zsync"
          for artifact in "$deb_artifact" "$appimage_artifact" "$appimage_zsync"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Expected artifact missing: $artifact" >&2
              exit 1
            fi
          done

          rm -rf target/packaging/release
          mkdir -p target/packaging/release
          deb_release_name="$(basename "$deb_artifact")"
          deb_release_name="${deb_release_name//\~/.}"
          cp "$appimage_artifact" target/packaging/release/
          cp "$appimage_zsync" target/packaging/release/
          cp "$deb_artifact" "target/packaging/release/$deb_release_name"

      - name: Generate SHA256 checksums
        working-directory: target/packaging/release
        run: |
          shopt -s nullglob
          artifacts=( *.AppImage *.AppImage.zsync *.deb )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No package artifacts found" >&2
            exit 1
          fi
          sha256sum "${artifacts[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages and checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$REF_NAME" \
            target/packaging/release/*.AppImage \
            target/packaging/release/*.AppImage.zsync \
            target/packaging/release/*.deb \
            target/packaging/release/SHA256SUMS \
            --clobber
