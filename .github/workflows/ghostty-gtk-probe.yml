name: Ghostty GTK Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Build Ghostty GTK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git \
            meson ninja-build python3 python3-gi libxml2-utils \
            libgtk-4-dev libadwaita-1-dev dbus-x11 xvfb gdb

      - name: Install blueprint-compiler
        run: |
          blueprint_compiler_commit=31b62c24a72c1670d2d93dcdf2d130f1ae12778e
          git clone --filter=blob:none --no-checkout \
            https://gitlab.gnome.org/GNOME/blueprint-compiler.git \
            /tmp/blueprint-compiler
          git -C /tmp/blueprint-compiler fetch --depth 1 origin "${blueprint_compiler_commit}"
          git -C /tmp/blueprint-compiler checkout --detach "${blueprint_compiler_commit}"
          meson setup /tmp/blueprint-compiler-build /tmp/blueprint-compiler --prefix=/usr
          sudo ninja -C /tmp/blueprint-compiler-build install
          blueprint-compiler --version

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Fetch Rust dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Ghostty GTK build probe
        run: scripts/ghostty-gtk-build-probe.sh

      - name: Ghostty GTK embedding library probe
        run: scripts/ghostty-gtk-lib-probe.sh

      - name: ForkTTY Ghostty GTK widget smoke
        env:
          FORKTTY_GHOSTTY_GTK_LIB: vendor/ghostty/zig-out/lib/ghostty-gtk-embed.so
          FORKTTY_GHOSTTY_GTK_PROBE_EXIT_AFTER_MS: "750"
          NO_AT_BRIDGE: "1"
        run: |
          cargo build -p forktty-ui-gtk --no-default-features --features gtk-ghostty
          set +e
          timeout 60s xvfb-run -a dbus-run-session -- \
            target/debug/forktty ghostty-gtk-probe
          status=$?
          set -e
          if [ "${status}" -eq 139 ]; then
            echo "::group::Ghostty GTK probe gdb backtrace"
            timeout 60s xvfb-run -a dbus-run-session -- \
              gdb -batch \
                -ex "set pagination off" \
                -ex "run" \
                -ex "thread apply all bt full" \
                -ex "quit" \
                --args target/debug/forktty ghostty-gtk-probe || true
            echo "::endgroup::"
          fi
          exit "${status}"
