[workspace]
members = [
    "crates/forktty-core",
    "crates/forktty-terminal",
    "crates/forktty-socket",
    "crates/forktty-ui-gtk",
    "crates/forktty-import",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.6"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
authors = ["Lucenx9"]
homepage = "https://github.com/Lucenx9/forktty"
repository = "https://github.com/Lucenx9/forktty"

[workspace.dependencies]
aes = "0.9"
async-channel = "2"
base64 = "0.22"
cbc = "0.2"
chrono = "0.4"
dirs = "6"
git2 = { version = "0.21", features = ["vendored-libgit2"] }
hmac = "0.13"
libc = "0.2"
notify-rust = "4"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
shell-words = "1"
tempfile = "3.10.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
