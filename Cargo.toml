[workspace]
members = [
    "crates/forktty-core",
    "crates/forktty-terminal",
    "crates/forktty-socket",
    "crates/forktty-ui-gtk",
    "crates/forktty-import",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.12"
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"
authors = ["Lucenx9"]
homepage = "https://forktty-site.vercel.app/"
repository = "https://github.com/Lucenx9/forktty"

[workspace.dependencies]
aes = "0.9"
async-channel = "2"
base64 = "0.22"
cbc = "0.2"
chrono = "0.4"
dirs = "6"
git2 = { version = "0.21", features = ["vendored-libgit2"] }
hmac = "0.13"
libc = "0.2"
libghostty-vt = "0.1.1"
nix = "0.31"
notify-rust = "4"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
sha1 = "0.11"
shell-words = "1"
tempfile = "3.10.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
toml = "1.1"
toml_edit = "0.25"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }

# libghostty-rs master rev 20edad15, vendored in vendor/libghostty-rs with a
# one-line zig -Dcpu=baseline patch for native builds: without it the built
# library's ISA depends on the build host's CPU, and an AVX-512 CI runner
# shipped release binaries that SIGILL on every non-AVX-512 machine (see
# vendor/libghostty-rs/FORKTTY-VENDORED.md). Both crates come from the same
# vendored tree so the bindings and the built library cannot drift apart.
# .cargo/config.toml pins LIBGHOSTTY_VT_SYS_OPTIMIZE=ReleaseSafe so debug and
# test builds keep the optimized VT parser too. Re-pin to upstream git (and
# drop the vendor) once upstream pins the CPU baseline for native builds.
[patch.crates-io]
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
libghostty-vt-sys = { path = "vendor/libghostty-rs/crates/libghostty-vt-sys" }
