# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >-
  Be concise and direct. Prioritize correctness, security, race conditions,
  resource cleanup, and tests over style-only comments.
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: >-
    Summarize user-visible behavior changes, native GTK/VTE impact, socket/core
    Rust impact, tests, and security/privacy considerations. Keep it short.
  review_status: true
  review_details: false
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions:
    - label: frontend
      instructions: >-
        Apply when the PR changes native GTK UI code or styles under
        crates/forktty-ui-gtk/.
    - label: rust
      instructions: Apply when the PR changes Rust code under crates/.
    - label: gtk
      instructions: >-
        Apply when the PR changes GTK/libadwaita/VTE UI, packaging, or desktop
        integration.
    - label: ci
      instructions: >-
        Apply when the PR changes GitHub Actions, Dependabot, CodeQL, audits, or
        release automation.
    - label: docs
      instructions: >-
        Apply when the PR primarily changes README, SPEC, ROADMAP, SECURITY,
        PRIVACY, or other documentation.
    - label: dependencies
      instructions: >-
        Apply when the PR changes Cargo.lock, package.json, or Cargo.toml
        dependencies.
    - label: security
      instructions: >-
        Apply when the PR changes socket APIs, PTY/process handling,
        notification command execution, worktree paths, permissions, audits, or
        authentication/security policy.
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!docs/assets/**"
    - "!.playwright-cli/**"
    - "!.omc/**"
    - "!.claude/**"
  path_instructions:
    - path: "scripts/**/*.mjs"
      instructions: >-
        This is Node CLI and hook-install logic over the local ForkTTY socket.
        Review for parameter validation, shell quoting, config merge safety,
        timeout handling, and compatibility with Node built-ins only.
    - path: "crates/forktty-ui-gtk/**/*.rs"
      instructions: >-
        This GTK4/libadwaita/VTE UI manages terminal widgets, shortcuts,
        dialogs, quake mode, and workspace rendering. Review for UI-thread
        safety, signal cleanup, focus behavior, terminal lifecycle, and avoiding
        expensive per-output work.
    - path: "crates/forktty-core/**/*.rs"
      instructions: >-
        This core model manages config, session, worktrees, notifications, and
        workspace state. Prioritize path traversal, dirty-state validation,
        session hardening, local privacy boundaries, and deterministic model
        updates.
    - path: "crates/forktty-socket/**/*.rs"
      instructions: >-
        This Unix socket server dispatches local JSON-RPC. Review request size
        bounds, selector ambiguity, async locking, socket permissions, and
        error contracts.
    - path: "crates/forktty-terminal/**/*.rs"
      instructions: >-
        This terminal backend owns VTE/headless surfaces. Review child process
        environment, close/resize/send-text semantics, and testability.
    - path: "scripts/**"
      instructions: >-
        Review packaging scripts for shell safety, reproducibility, pinned
        assumptions, and compatibility with the CI commands in .github/workflows.
    - path: ".github/workflows/**"
      instructions: >-
        Review GitHub Actions for pinned actions, least-privilege permissions,
        reproducible dependency installation, audit coverage, and avoiding
        secrets or release artifacts in logs.
    - path: "Cargo.lock"
      instructions: >-
        Review dependency changes for unexpected major upgrades, yanked crates,
        security-sensitive transitive changes, and alignment with Cargo.toml.
    - path: "**/*.md"
      instructions: >-
        Keep documentation accurate with the current Linux GTK/VTE behavior,
        command names, privacy claims, and security reporting guidance.
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - WIP
      - Draft
      - DNM
    drafts: false
    base_branches:
      - main
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Use a concise, descriptive title. Include the affected area when useful,
        for example: gtk, rust, socket, ci, docs, or security.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    docstrings:
      mode: "off"
    custom_checks:
      - name: Privacy boundary
        mode: warning
        instructions: >-
          Pass if changed runtime code preserves ForkTTY's local-only privacy
          model: no telemetry, remote network calls, or persistence of terminal
          output outside documented local config/session state unless the PR
          explicitly documents and gates it behind user action.
      - name: Terminal command safety
        mode: warning
        instructions: >-
          Pass if changes to PTY, socket API, worktree, shell, packaging scripts,
          or notification command execution validate untrusted input, normalize
          paths, handle process lifecycle, and avoid shell injection.
  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000
    eslint:
      enabled: false
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: true
    biome:
      enabled: false
    oxc:
      enabled: false
    stylelint:
      enabled: false
    languagetool:
      enabled: false

chat:
  art: false
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - README.md
      - SPEC.md
      - SECURITY.md
      - PRIVACY.md
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "crates/**/*.rs"
        instructions: >-
          Prefer doc comments for public socket API contracts,
          process lifecycle behavior, and security-sensitive path/command
          handling. Avoid restating obvious implementation details.
      - path: "scripts/**/*.mjs"
        instructions: >-
          Prefer comments only for exported helpers, hook merge contracts, and
          socket lifecycle edge cases.
  unit_tests:
    path_instructions:
      - path: "scripts/**/*.mjs"
        instructions: >-
          Generate focused Node built-in tests under scripts/*.test.mjs. Avoid
          tests that depend on the developer's shell, home directory, or display
          server.
      - path: "crates/**/*.rs"
        instructions: >-
          Generate Rust tests that can run with cargo test --workspace. Prefer
          temporary directories and mocked dependencies; avoid spawning
          long-lived shells or requiring desktop notification services.

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: true
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: false
    labeling_instructions:
      - label: bug
        instructions: >-
          Something is broken, regressed, flaky, or behaves differently than
          documented.
      - label: enhancement
        instructions: A new feature, workflow improvement, or planned roadmap item.
      - label: security
        instructions: >-
          Security-sensitive behavior, vulnerability report, hardening work,
          permissions, command execution, or dependency audit finding.
      - label: docs
        instructions: Documentation-only request or clarification.
